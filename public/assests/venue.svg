<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">Seaside wedding rotunda at sunset</title>
  <desc id="desc">A stone wedding pavilion with a flowered arch, ocean view, and a sunlit aisle at golden hour.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2=".2" y2="1">
      <stop stop-color="#e6a66f"/>
      <stop offset=".5" stop-color="#f8d6a1"/>
      <stop offset="1" stop-color="#ffe8bc"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#78aeb0"/>
      <stop offset="1" stop-color="#3c777d"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff0d5"/>
      <stop offset=".5" stop-color="#d8b88f"/>
      <stop offset="1" stop-color="#f4dfbd"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#d8c19d"/>
      <stop offset="1" stop-color="#9e8061"/>
    </linearGradient>
    <linearGradient id="aisle" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff8e9"/>
      <stop offset="1" stop-color="#dfc9a9"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

